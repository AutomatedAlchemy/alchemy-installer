# Tools the installer offers. This repo holds none of them itself.
#
# `path` is relative to this file and pins a checkout that is never cloned.
# `url` must be an https:// URL; it is cloned into ROOT/<name> on the first run.
# A source with both uses `path` when that directory exists, else the URL.
# `installer.local.toml` next to this file overrides `root` and any `path`.

[[source]]
name = "bloggen"
url = "https://github.com/AutomatedAlchemy/BlogGen"

[[source]]
name = "manim-kit"
url = "https://github.com/AutomatedAlchemy/manim-kit"

